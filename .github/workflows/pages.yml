name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public site
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          if [[ -z "$APPS_SCRIPT_URL" ]]; then
            echo "Set the APPS_SCRIPT_URL repository variable before deploying."
            exit 1
          fi

          mkdir -p _site
          cp index.html style.css script.js greedy_cat.jpg _site/
          node -e 'const fs = require("node:fs"); const file = "_site/script.js"; const source = fs.readFileSync(file, "utf8"); const updated = source.replace("const APPS_SCRIPT_URL = \"\";", `const APPS_SCRIPT_URL = ${JSON.stringify(process.env.APPS_SCRIPT_URL)};`); if (updated === source) throw new Error("Apps Script URL placeholder not found"); fs.writeFileSync(file, updated);'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
