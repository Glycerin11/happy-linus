<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday! 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="plane" aria-hidden="true">✈️</div>

    <main class="card">
      <div class="confetti">🎈 ✨ 🎉 ✨ 🎈</div>
      <h1>Happy Birthday! 🎂</h1>
      <p class="subtitle">Seit diesem besonderen Tag sind</p>

      <div class="counter">
        <span id="days">0</span>
        <small>Tage</small>
      </div>

      <p id="sinceText" class="since"></p>
      <p id="message" class="message">Eine kleine Reise durch die Zeit. 🚂</p>
    </main>

    <div class="train" aria-hidden="true">
      <span class="smoke s1">☁️</span>
      <span class="smoke s2">☁️</span>
      <span class="engine">🚂</span>
      <span class="wagon food">🍝</span>
      <span class="wagon food">🍕</span>
      <span class="wagon food">🍰</span>
    </div>

    <footer>✨ Eine bunte Seite für einen besonderen Menschen ✨</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
